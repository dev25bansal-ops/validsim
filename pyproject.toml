[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validsim"
description = "Sim-to-Real CI/CD validation for robot foundation models."
readme = "README.md"
# Proprietary today. NOTE: the CLI (validsim/cli.py) is slated to be
# open-sourced under the MIT licence in Phase 2.
license = { text = "Proprietary" }
authors = [{ name = "ValidSim Founders" }]
requires-python = ">=3.10"
dynamic = ["version"]

# Runtime dependencies — keep in sync with requirements.txt
# (requirements.txt additionally pins pytest, which lives in [dev] here).
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
validsim = "validsim.cli:app"

[tool.setuptools]
# Ship only the validsim package tree (exclude tests/, actions/, api/, etc.).
packages = { find = { include = ["validsim*"] } }

[tool.setuptools.dynamic]
version = { attr = "validsim.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"
