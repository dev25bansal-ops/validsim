# =============================================================================
# ValidSim — local development / MVP stack
#
#   api      : FastAPI app built from the local Dockerfile (port 8000)
#   redis    : future job queue / result backend for validation runs
#   postgres : system-of-record for runs, scorecards, and audit trail
#
# All three services define healthchecks; `api` waits for its data stores to
# become healthy before starting. Credentials below are LOCAL DEV DEFAULTS —
# override via environment variables / a .env file (never commit real ones).
#
# NOTE: The GPU Isaac Sim validation worker is intentionally NOT part of this
# stack yet — this repo has no GPU host in the loop. See the commented
# placeholder at the bottom of this file for the Week 2+ wiring.
# =============================================================================

name: validsim

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: validsim:local
    container_name: validsim-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      VALIDSIM_ENV: development
      VALIDSIM_REDIS_URL: "redis://redis:6379/0"
      VALIDSIM_DATABASE_URL: "postgresql://validsim:${POSTGRES_PASSWORD:-validsim_dev_only}@postgres:5432/validsim"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: validsim-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:6379:6379" # host access for debugging only; drop if not needed
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: validsim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: validsim
      POSTGRES_USER: validsim
      # DEV DEFAULT ONLY — set POSTGRES_PASSWORD in your .env for anything real.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-validsim_dev_only}"
    ports:
      - "127.0.0.1:5432:5432" # host access for debugging only; drop if not needed
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validsim -d validsim"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
  postgres-data:

