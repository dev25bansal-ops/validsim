# =============================================================================
# ValidSim Release — cut a production artifact from every `v*` tag.
#
#   job 1 (test):         ruff lint -> pytest (JUnit XML) -> artifacts + summary
#   job 2 (docker):       build + push the image to GHCR, gated on `needs: test`
#                         tags: latest + v<tag-name>
#   job 3 (publish-pypi): PyPI dry-run via `twine check` only — never a real
#                         upload. Guarded so the packaging steps only run when
#                         PYPI_API_TOKEN exists (real credentials are never used
#                         here; this is a release-time sanity check).
#
# The same gate-the-deploy discipline applies: a failing suite can never
# produce an image or a release artifact.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write # required for the GHCR push in the docker job

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release that is mid-push

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        continue-on-error: false
        run: ruff check validsim tests

      - name: Run tests (pytest)
        continue-on-error: false
        run: python -m pytest tests/ -v --junitxml=pytest-results.xml

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## Pytest summary"
            python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          p = pathlib.Path("pytest-results.xml")
          if p.exists():
              root = ET.parse(p).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is not None:
                  a = suite.attrib
                  print(
                      f"- tests: {a.get('tests', '?')} | failures: {a.get('failures', '?')} "
                      f"| errors: {a.get('errors', '?')} | skipped: {a.get('skipped', '?')} "
                      f"| time: {a.get('time', '?')}s"
                  )
          else:
              print("- no JUnit report produced (suite crashed before writing it)")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

  docker:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    needs: test # hard gate: only push an image built from green tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ValidSim image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-pypi:
    name: Publish to PyPI (dry-run via twine check)
    runs-on: ubuntu-latest
    needs: docker # publish follows a successfully pushed image
    steps:
      # GitHub cannot read `secrets.*` in a job-level (or step-level) `if`,
      # so the token check is turned into an output first, then used to gate
      # the real packaging steps below. No step here ever performs an actual
      # PyPI upload — this job is a dry-run release sanity check only.
      - name: Detect PyPI credentials
        id: pypi-token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
            echo "PYPI_API_TOKEN present — running dry-run packaging checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "PYPI_API_TOKEN not set — skipping PyPI packaging checks." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.pypi-token.outputs.has-token == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.pypi-token.outputs.has-token == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        if: steps.pypi-token.outputs.has-token == 'true'
        run: python -m pip install build twine

      - name: Build distributions
        if: steps.pypi-token.outputs.has-token == 'true'
        run: python -m build

      - name: Validate distributions (twine check — no upload)
        if: steps.pypi-token.outputs.has-token == 'true'
        run: twine check dist/*