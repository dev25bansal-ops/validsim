# =============================================================================
# ValidSim CI — runs on every push and PR to main.
#
#   job 1 (test):     ruff lint -> pytest (JUnit XML) -> artifacts + summary
#   job 2 (postgres): live PostgreSQL tests + SQLite/Postgres parity
#   job 3 (docker):   image build (NEVER pushes), gated on green unit tests
#   job 4 (compose):  build and exercise the full Postgres + Redis + API + worker
#                     topology, including a real API-to-worker queue drain
#
# A failing suite can therefore never produce an image — the same
# gate-the-deploy discipline ValidSim sells to robot-fleet teams.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # requirements-dev.txt is what the `postgres`, `nightly` and `release`
        # jobs install, so it is the declared set for "test tooling" in this
        # repo. The previous ad-hoc pair ("ruff>=0.5" "pytest-cov>=5.0") pulled
        # pytest-cov transitively and NOTHING else — so PyYAML (needed by
        # tests/test_delivery_pipeline.py) was absent and the `test` job died
        # with ModuleNotFoundError: No module named 'yaml' on every run,
        # before a single test executed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        continue-on-error: false
        run: ruff check validsim tests

      - name: Run tests (pytest with coverage)
        continue-on-error: false
        # --cov-fail-under is stated here as well as in pyproject.toml: the floor
        # is a CI contract, so it must be visible in the CI config, not implied
        # by a config file a reader has to know to open.
        run: python -m pytest tests/ --cov=validsim --cov-report=term-missing --cov-report=xml --cov-fail-under=90 --junitxml=pytest-results.xml

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## Pytest summary"
            python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          p = pathlib.Path("pytest-results.xml")
          if p.exists():
              root = ET.parse(p).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is not None:
                  a = suite.attrib
                  print(
                      f"- tests: {a.get('tests', '?')} | failures: {a.get('failures', '?')} "
                      f"| errors: {a.get('errors', '?')} | skipped: {a.get('skipped', '?')} "
                      f"| time: {a.get('time', '?')}s"
                  )
          else:
              print("- no JUnit report produced (suite crashed before writing it)")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  postgres:
    name: PostgreSQL backend parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: validsim
          POSTGRES_PASSWORD: validsim-ci-password
          POSTGRES_DB: validsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U validsim -d validsim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VALIDSIM_PG_URL: postgresql://validsim:validsim-ci-password@127.0.0.1:5432/validsim
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run live PostgreSQL and SQLite parity tests
        continue-on-error: false
        run: >-
          python -m pytest tests/test_store_postgres.py
          tests/test_store_differential_agent.py
          -p no:cacheprovider --no-cov -q -rs

  docker:
    name: Build image (no push)
    runs-on: ubuntu-latest
    needs: [test, postgres] # hard gate: only build a Docker image from green tests, including the production store backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build ValidSim image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false # CI only proves the image builds; publishing comes later
          tags: validsim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Compose topology & queue drain
    runs-on: ubuntu-latest
    needs: [test, postgres]
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: validsim-ci-password
      VALIDSIM_API_KEY: validsim-ci-api-key
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate compose model
        run: docker compose config >/dev/null

      - name: Start Postgres, Redis, API, and worker
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Assert health and drain a queued job
        shell: bash
        run: |
          set -euo pipefail
          export VALIDSIM_API_KEY
          export VALIDSIM_ENV=development

          health="$(docker compose exec -T api python -c \
            "import json,urllib.request; print(json.dumps(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)))))")"
          python - "$health" <<'PY'
          import json
          import sys

          health = json.loads(sys.argv[1])
          assert health["status"] == "ok", health
          assert health["auth_enabled"] is True, health
          assert health["store_backend"] == "postgres", health
          assert health["job_queue_backend"] == "redis", health
          PY

          # The compose file provisions a key, so the protected queue endpoint
          # must require that exact credential. Health remains deliberately public.
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/v1/jobs)"
          test "$status" = 401

          response="$(curl --silent --show-error --fail \
            -H "X-API-Key: $VALIDSIM_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"checkpoint_id":"ci-compose","task_id":"pick-place","episodes":1,"adversarial":0}' \
            http://127.0.0.1:8000/api/v1/jobs)"
          job_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<<"$response")"

          deadline=$((SECONDS + 180))
          while :; do
            job="$(curl --silent --show-error --fail \
              -H "X-API-Key: $VALIDSIM_API_KEY" \
              "http://127.0.0.1:8000/api/v1/jobs/$job_id")"
            state="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$job")"
            case "$state" in
              done) break ;;
              failed)
                echo "::error::compose worker failed job $job_id: $job"
                exit 1
                ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "::error::compose worker did not drain $job_id within 180 seconds"
              exit 1
            fi
            sleep 2
          done

          result="$(python -c 'import json,sys; print(json.load(sys.stdin)["result"])' <<<"$job")"
          test "$result" = "$job_id"

          run="$(curl --silent --show-error --fail \
            -H "X-API-Key: $VALIDSIM_API_KEY" \
            "http://127.0.0.1:8000/api/v1/validations/$job_id")"
          python - "$job_id" "$run" <<'PY'
          import json
          import sys

          run_id, raw = sys.argv[1:]
          validation = json.loads(raw)
          assert validation["run_id"] == run_id, validation
          assert validation["episode_count"] == 1, validation
          PY

          postgres_run="$(docker compose exec -T postgres \
            psql -U validsim -d validsim -Atc \
            "SELECT run_id FROM validations WHERE run_id = '$job_id';")"
          test "$postgres_run" = "$job_id"

      - name: Tear down Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
