# =============================================================================
# ValidSim CI — runs on every push and PR to main.
#
#   job 1 (test):   ruff lint -> pytest (JUnit XML) -> artifacts + step summary
#   job 2 (docker): image build (NEVER pushes), gated on `needs: test`
#
# A failing suite can therefore never produce an image — the same
# gate-the-deploy discipline ValidSim sells to robot-fleet teams.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff>=0.5" "pytest-cov>=5.0"

      - name: Lint (ruff)
        continue-on-error: false
        run: ruff check validsim tests

      - name: Run tests (pytest with coverage)
        continue-on-error: false
        run: python -m pytest tests/ --cov=validsim --cov-report=term-missing --cov-report=xml --junitxml=pytest-results.xml

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## Pytest summary"
            python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          p = pathlib.Path("pytest-results.xml")
          if p.exists():
              root = ET.parse(p).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is not None:
                  a = suite.attrib
                  print(
                      f"- tests: {a.get('tests', '?')} | failures: {a.get('failures', '?')} "
                      f"| errors: {a.get('errors', '?')} | skipped: {a.get('skipped', '?')} "
                      f"| time: {a.get('time', '?')}s"
                  )
          else:
              print("- no JUnit report produced (suite crashed before writing it)")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  docker:
    name: Build image (no push)
    runs-on: ubuntu-latest
    needs: test # hard gate: only build a Docker image from green tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ValidSim image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # CI only proves the image builds; publishing comes later
          tags: validsim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
