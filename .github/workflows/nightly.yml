# =============================================================================
# ValidSim Nightly — the 24/7 continuous-validation story, applied to
# ValidSim itself. Every night at 03:00 UTC the FULL test suite runs on a
# clean checkout and its results are archived, so regressions that slipped
# past per-PR CI (flaky tests, dependency drift, time-of-day effects) are
# caught before founders demo anything.
#
#   job 1 (full-test):  the correctness suite -> JUnit XML -> artifacts
#   job 2 (benchmark):  the *timed* tier, compared against the committed
#                       tests/bench/baseline.json. It is a separate job
#                       because tests/bench/conftest.py registers its
#                       --validsim-benchmark-* options for that subtree ONLY;
#                       passing the flag to a `tests/` run aborts collection
#                       with "unrecognized arguments".
#
# Also supports manual triggering from the Actions tab (workflow_dispatch).
# =============================================================================
name: Nightly Validation

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # a re-dispatch supersedes the in-flight sweep

jobs:
  full-test:
    name: Full pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # requirements-dev.txt is the repo's declared test tooling (pytest,
        # pytest-cov, ruff, PyYAML). Without it `pytest` itself is absent.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full test suite (pytest)
        run: python -m pytest tests/ -v --junitxml=nightly-pytest-results.xml

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## Nightly pytest summary"
            python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          p = pathlib.Path("nightly-pytest-results.xml")
          if p.exists():
              root = ET.parse(p).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is not None:
                  a = suite.attrib
                  print(
                      f"- tests: {a.get('tests', '?')} | failures: {a.get('failures', '?')} "
                      f"| errors: {a.get('errors', '?')} | skipped: {a.get('skipped', '?')} "
                      f"| time: {a.get('time', '?')}s"
                  )
          else:
              print("- no JUnit report produced (suite crashed before writing it)")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-pytest-${{ github.run_number }}
          path: nightly-pytest-results.xml
          retention-days: 30

  benchmark:
    name: Benchmark regression gate (timed tier)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # requirements-dev.txt carries pytest; the benchmarks themselves are
        # stdlib-only (tests/bench/conftest.py), so no extra wheels are needed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # This is the step the nightly was silently not doing. `pytest tests/ -v`
      # alone never registers the --validsim-benchmark-* options, because
      # tests/bench/conftest.py only contributes them for that subtree; and even
      # for a tests/bench run, without an explicit
      # --validsim-benchmark-compare/save, tests/bench/conftest.py's
      # pytest_collection_modifyitems adds `skip` to EVERY `benchmark`-marked
      # test. The suite therefore reported a clean pass while 100% of the
      # timing and memory regressions it exists to catch went unmeasured.
      # Targeting tests/bench/ is what registers the flags; `slow` is excluded
      # here because it is measured in the dedicated job below (100k-episode
      # runs are ~9-19s each and get their own timeout budget).
      - name: Run timed benchmarks and compare against the committed baseline
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/bench -m "benchmark and not slow" \
            --validsim-benchmark-compare -v 2>&1 | tee "$RUNNER_TEMP/bench-fast.log"

      # `slow` is the heavy tier (test_run_and_score_max_episodes: 50k/100k
      # episodes). Kept in its own job so a timeout here cannot mask or abort
      # the correctness suite, and so the two tiers report independently.
      - name: Run the slow benchmark tier
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/bench -m slow \
            --validsim-benchmark-compare -v 2>&1 | tee "$RUNNER_TEMP/bench-slow.log"

      # The gate as written CANNOT fail the build, and this step is why that has
      # to be compensated for here rather than in the plugin.
      # tests/bench/conftest.py::pytest_terminal_summary reports regressions by
      # mutating `terminalreporter._session.testsfailed`, but pytest computes the
      # process exit status in `_pytest.main._main` — which tests
      # `session.testsfailed` and returns BEFORE any terminal-summary hook runs.
      # The bump therefore lands after the exit code is already decided: a 25%+
      # /20ms+ regression prints a red REGRESSION line and the run still exits 0,
      # i.e. a green nightly. (Verified against the installed pytest 9.1.1:
      # a simulated regression produced `REAL_EXITCODE=0`.) That conftest is
      # under tests/, owned by another team, so the enforcement is done here
      # instead — read the gate's own verdict out of its output and fail on it.
      - name: Fail the job on a benchmark regression
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for log in "$RUNNER_TEMP/bench-fast.log" "$RUNNER_TEMP/bench-slow.log"; do
            if grep -q '^REGRESSION ' "$log" 2>/dev/null; then
              echo "::error::benchmark regression detected in $(basename "$log"):"
              grep '^REGRESSION ' "$log" | sed 's/^/::error::/'
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::nightly benchmark gate FAILED (regression beyond 25% and 20ms)."
            echo "If this looks like runner noise rather than a real regression, refresh"
            echo "the committed baseline deliberately: pytest tests/bench -m 'benchmark and not slow' --validsim-benchmark-save"
            exit 1
          fi
          echo "nightly benchmark gate passed: no regression beyond tolerance."

      - name: Explain the comparison policy
        if: always()
        run: |
          {
            echo "## Benchmark regression gate"
            echo "- Compared every measurement against the committed \`tests/bench/baseline.json\`."
            echo "- Fails only on a regression of **more than 25%** *and* **more than 20 ms** absolute."
            echo "- Runs only when \`tests/bench/\` is on the target path, because that is the only"
            echo "  place \`--validsim-benchmark-compare\` is a registered option."
          } >> "$GITHUB_STEP_SUMMARY"
